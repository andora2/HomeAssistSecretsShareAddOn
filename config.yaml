name: Secret Share
version: "1.0.0"
slug: secret_share
description: Kurzlebiges Teilen von Text und Passwoertern im LAN - Inhalt lebt nur im RAM
# Auf welchen Prozessor-Typen das Add-on gebaut werden darf.
# amd64 = dein spaeterer N100/N150-Mini-PC, aarch64 = HA Green / Raspberry Pi.
arch:
  - aarch64
  - amd64
  - armv7
# init: false -> wir liefern unseren eigenen Start-Befehl (run.sh), kein Zusatz-Init noetig.
init: false
# application -> ein dauerhaft laufender Dienst mit UI.
startup: application
# boot: auto -> DAS ist dein "always on": HA startet das Add-on nach jedem Neustart selbst.
boot: auto
# ingress: true -> UI erscheint in der HA-Seitenleiste, hinter dem HA-Login, ueber HAs Reverse-Proxy.
ingress: true
ingress_port: 8099
panel_icon: mdi:key-variant
